<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="selfwriting：写作图标（可遮罩）">
  <title>selfwriting</title>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2705a"/>
      <stop offset="0.55" stop-color="#bb5138"/>
      <stop offset="1" stop-color="#963a29"/>
    </linearGradient>
    <linearGradient id="rulem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf8f2" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#fdf8f2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fdf8f2" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="inkm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdf1ea"/>
    </linearGradient>
  </defs>

  <!-- 满幅背景，图形收缩到中心 60% 的安全区 -->
  <rect width="512" height="512" fill="url(#bgm)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <path d="M96 168 H416" stroke="url(#rulem)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M96 236 H416" stroke="url(#rulem)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M96 372 H416" stroke="url(#rulem)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M148 304 C 206 214, 262 214, 316 296"
          stroke="url(#inkm)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="374" cy="336" r="28" fill="url(#inkm)"/>
  </g>
</svg>
